[project]
name = "demoreel"
version = "0.1.0"
description = "Upload a CS2 demo, get match metrics and auto-generated highlight videos. REST API + MCP server, agent-friendly."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Lucas Padilha" }]
keywords = ["cs2", "counter-strike", "demo", "highlights", "mcp", "esports"]
dependencies = [
    "demoparser2>=0.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "typer>=0.12",
    "pillow>=10.4",
    "imageio-ffmpeg>=0.5",
    "mcp>=2.0",
    "skia-python>=144.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
demoreel = "demoreel.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demoreel"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["demo: needs a real .dem file in demos/ (skipped when absent)"]
